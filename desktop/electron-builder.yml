# Unsigned builds for now — no Apple Developer ID and no Windows Authenticode
# cert. macOS shows the Gatekeeper block (Privacy & Security → Open Anyway);
# Windows shows SmartScreen (More info → Run anyway). Add signing once the
# accounts/certs exist. See desktop/README.md.

appId: com.barbro.desktop
productName: BarBro Desktop
asar: true

# Python scripts and native CLIs must live outside asar so subprocess can execute/read them.
asarUnpack:
  - native/python/**/*
  - native/bin/**/*

directories:
  output: release

files:
  - electron/**/*
  - native/**/*
  - package.json

# The OFFLINE BUILD: the web app itself, so the desktop app can serve it with
# no internet. Staged by `scripts/prepare-offline-bundle.mjs`, which ships NO
# env file at all and refuses to stage if a secret — or the Supabase config
# that would restore a sign-in — is found anywhere in the output.
#
# `extraResources` (not `files`) on purpose: it lands beside the asar rather
# than inside it, which is where `resolveOfflineBuildDir()` looks first, and
# keeps the server's own files readable at runtime.
extraResources:
  - from: ../build-node
    to: build-node
    filter:
      - '**/*'
      # Belt and braces against a stale env file from an older build tree —
      # loaded at runtime it would put the sign-in screen back.
      - '!.env'

# Predictable, version-agnostic filenames so `releases/latest/download/<file>`
# URLs in static/desktop-downloads.json keep resolving forever.
artifactName: "BarBro-Desktop-${arch}.${ext}"

mac:
  category: public.app-category.music
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64

dmg:
  title: "${productName} ${version}"

win:
  target:
    - target: nsis
      arch:
        - x64

# Per-user, no admin prompt, silent-ish install that relaunches the app when
# done — the closest Windows analog to "drag to Applications". latest.yml is
# generated alongside for any future auto-updater wiring.
nsis:
  oneClick: true
  perMachine: false
  runAfterFinish: true

# electron-builder uploads the built DMG/ZIP + latest-mac.yml directly to a
# GitHub Release matching the git tag. `GH_TOKEN` is provided by the
# desktop-release workflow.
publish:
  provider: github
  owner: silverknet
  repo: fast_transcriber
  releaseType: release
