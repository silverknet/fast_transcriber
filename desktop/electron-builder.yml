# Unsigned builds for now — no Apple Developer ID and no Windows Authenticode
# cert. macOS shows the Gatekeeper block (Privacy & Security → Open Anyway);
# Windows shows SmartScreen (More info → Run anyway). Add signing once the
# accounts/certs exist. See desktop/README.md.

appId: com.barbro.desktop
productName: BarBro Desktop
asar: true

# Python scripts and native CLIs must live outside asar so subprocess can execute/read them.
asarUnpack:
  - native/python/**/*
  - native/bin/**/*

directories:
  output: release

files:
  - electron/**/*
  - native/**/*
  - package.json

# Predictable, version-agnostic filenames so `releases/latest/download/<file>`
# URLs in static/desktop-downloads.json keep resolving forever.
artifactName: "BarBro-Desktop-${arch}.${ext}"

mac:
  category: public.app-category.music
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64

dmg:
  title: "${productName} ${version}"

win:
  target:
    - target: nsis
      arch:
        - x64

# Per-user, no admin prompt, silent-ish install that relaunches the app when
# done — the closest Windows analog to "drag to Applications". latest.yml is
# generated alongside for any future auto-updater wiring.
nsis:
  oneClick: true
  perMachine: false
  runAfterFinish: true

# electron-builder uploads the built DMG/ZIP + latest-mac.yml directly to a
# GitHub Release matching the git tag. `GH_TOKEN` is provided by the
# desktop-release workflow.
publish:
  provider: github
  owner: silverknet
  repo: fast_transcriber
  releaseType: release
